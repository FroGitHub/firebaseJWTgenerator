<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Firebase JWT Generator</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #121212;
            color: #e5e5e5;

            max-width: 800px;
            margin: 60px auto;
            padding: 0 20px;
        }


        h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #ffffff;
        }


        label {
            display: block;
            margin-bottom: 8px;
            color: #aaa;
            font-size: 14px;
        }


        select,
        button,
        textarea {

            width: 100%;
            margin-top: 12px;

            padding: 14px 16px;

            border-radius: 14px;

            border: 1px solid #333;

            background: #1e1e1e;

            color: #fff;

            font-size: 15px;

            outline: none;

            transition: 0.2s;
        }


        select:hover,
        textarea:hover {
            border-color: #555;
        }


        select:focus,
        textarea:focus {
            border-color: #7c3aed;
        }


        textarea {

            height: 260px;

            resize: vertical;

            font-family: Consolas, monospace;

            font-size: 13px;

            line-height: 1.5;

            margin-top: 20px;
        }


        button {

            background: #7c3aed;

            border: none;

            cursor: pointer;

            font-weight: 600;

            color: white;

        }


        button:hover {

            background: #8b5cf6;

            transform: translateY(-1px);

        }


        button:active {

            transform: translateY(0);

        }


        #copy {

            background: #2563eb;

        }


        #copy:hover {

            background: #3b82f6;

        }


        .container {

            background: #181818;

            padding: 30px;

            border-radius: 24px;

            box-shadow:
                0 20px 50px rgba(0,0,0,0.4);

        }

    </style>
</head>

<body>

<div class="container">

<h2>Firebase JWT Generator</h2>

<label>User:</label>

<select id="emailSelect">
</select>


<button id="generate">
    Генерувати JWT
</button>


<textarea id="token" readonly></textarea>


<button id="copy">
    Копіювати
</button>


</div>


<script type="module" src="/main.js"></script>

</body>
</html>
